name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build and run tests
        run: npm test

      - name: Regenerate and verify the public capability manifest
        run: |
          npm run capabilities
          git diff --exit-code -- docs/Матрица-возможностей.json

      - name: Test staging and promotion isolation, rollback, and quarantine
        run: bash deployment/tests/update-ready.test.sh
